# Pinned commits for nerfstudio-rocm's accelerated ROCm dependencies.
# Update by hand after intentionally advancing a submodule/pip install source;
# `rocm/diagnostics.py` (ns-rocm-info) reads this file verbatim for bug reports.

[stack]
rocm = "7.2.2"
python = "3.12"
torch = "2.10.0"
docker_base = "ghcr.io/bjoernellens1/splatograph:rocm-python-base-snapshot"

[gsplat]
repo = "https://github.com/bjoernellens1/gsplat"
branch = "release/1.5.3b2"
commit = "4515618291906856d8471c95b65c060d0cec4e43"
status = "verified on gfx1151: full pytest suite 114 passed / 1 skipped / 87 failed — all 87 attributable to the test-only nerfacc dependency having no ROCm support at the time (measured before nerfacc-rocm existed; worth re-running now that a verified ROCm nerfacc is available, see [nerfacc] below), zero gsplat kernel failures (see gsplat#5); Splatfacto trained 7000 iterations on bonsai (mip-nerf360) with no NaN/Inf and confirmed densification; builds as a hard docker build-time dependency (docker/Dockerfile.rocm)"

[nerfacc]
repo = "https://github.com/bjoernellens1/nerfacc-rocm"
branch = "release/0.5.3"
commit = "cba5a63bb7cc3486ea31af3505aa1ca2a8c44d9d"
status = "verified on gfx1151: own pytest suite 23 passed / 0 failed (21/23 real exercised coverage, 2 test_vdb.py tests short-circuit on missing optional fvdb dep, unrelated to ROCm); Instant-NGP trained 5000 iterations on bonsai (mip-nerf360) with no NaN/Inf, train loss 0.114->0.0044 (26x), train PSNR 9.6->23.4dB, eval PSNR 15.2->20.6dB (peak 22.8), and final-checkpoint occupancy grid 29.07% occupied confirming OccGridEstimator actively prunes empty space; builds as a hard docker build-time dependency (docker/Dockerfile.rocm)"

[tiny_rocm_nn]
repo = "https://github.com/bjoernellens1/tiny-rocm-nn"
branch = "rocm-gfx1151-validation"
commit = "5bd12ae6f7efe61a087b28b182be5cf76182b781"
status = "verified on gfx1151: builds cleanly under `docker build` (hipBLAS API-version fix ported from kodai731/rocm-gfx1100; hard dependency in docker/Dockerfile.rocm, requires --recursive clone for the vendored dependencies/fmt submodule); wave32 numerical correctness verified via an independent PyTorch reference (tests/rocm/tcnn_wave32_correctness.py) — HashGrid, SphericalHarmonics, and FullyFusedMLP all match to within ~1-2 fp16 ULP forward and backward, no lane/shuffle bug found (the one apparent MLP backward mismatch at bs=128/ReLU was root-caused to a legitimate fp16 ReLU-kink disagreement, not a wave32 defect, via a seed sweep and a Sigmoid control); CutlassMLP still not implemented, widths outside {64,128} fall back to implementation=torch; Instant-NGP trained 5000 iterations on bonsai (mip-nerf360) with tcnn genuinely active (confirmed via live pipeline module introspection, not just log-absence-of-fallback), no NaN/Inf, train loss 0.11959->0.001537, train PSNR 9.339->28.134dB, eval PSNR 22.22->26.55dB — beating the torch-fallback Instant-NGP baseline (train loss 0.0044, train PSNR 23.4dB) on the same scene"

[colmap]
repo = "https://github.com/bjoernellens1/colmap"
branch = "hip-integration"
commit = "807af94b517b7637c5872194a47825c686c7983d"
status = "full HIP acceleration: GPU SIFT extraction/matching, patch_match_stereo dense stereo, and CASPAR bundle adjustment (native OPENCV camera-model support) all HIP-accelerated; hard dependency in docker/Dockerfile.rocm (-DCUDA_ENABLED=OFF -DHIP_ENABLED=ON -DCASPAR_ENABLED=ON). Verified end-to-end on real gfx1151 hardware by rosbag-colmap-pipeline's production gttool run-colmap pipeline (613/613 frames registered, genuine GPU-side SIFT confirmed in logs, Caspar-HIP OPENCV bundle adjustment converging correctly after a real NaN bug was found and fixed in commit b5ead5a9 — see docs/local-hip-run.md in that repo). nerfstudio-rocm's own Docker build of this branch/commit has not yet had its own independent build+runtime verification pass (tracked as a follow-up in ROCM.md)."
