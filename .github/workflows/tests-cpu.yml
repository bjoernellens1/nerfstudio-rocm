name: tests-cpu

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rocm/ package (CPU-only, no GPU deps)
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: rocm backend/capabilities tests
        # -o addopts="" overrides nerfstudio's own pyproject.toml addopts
        # (-n=4 needs pytest-xdist, --jaxtyping-packages needs jaxtyping's
        # pytest plugin — neither is installed here, this job is deliberately
        # minimal and doesn't need nerfstudio's full test-suite flags).
        run: pytest -o addopts="" tests/rocm/test_backend.py -v
