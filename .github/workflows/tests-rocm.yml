name: tests-rocm

# Self-hosted ROCm runner required (gfx1151/gfx942); no such runner exists yet
# for this repo, so this workflow is manual-trigger only until one is
# provisioned. Do not add `on: pull_request` before that runner exists.
on:
  workflow_dispatch:

jobs:
  phase1-baseline:
    runs-on: [self-hosted, rocm]
    steps:
      - uses: actions/checkout@v4
      - name: Build ROCm image
        run: docker build -f docker/Dockerfile.rocm -t nerfstudio-rocm:ci .
      - name: Run Phase-1 baseline smoke test
        run: |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host \
            -v "$PWD/tests/rocm/logs:/workspace/nerfstudio-rocm/tests/rocm/logs" \
            nerfstudio-rocm:ci bash scripts/smoke-test.sh
      - name: Run Splatfacto smoke test (bonsai, mip-nerf360)
        # NOTE: dataset mount path below is a placeholder — no self-hosted
        # gfx1151 runner exists yet to validate the real path. Update when
        # one is provisioned.
        run: |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host \
            -v /data/mipnerf360:/data/mipnerf360:ro \
            -v "$PWD/tests/rocm/logs:/workspace/nerfstudio-rocm/tests/rocm/logs" \
            nerfstudio-rocm:ci bash -c "set -o pipefail; ns-train splatfacto --data /data/mipnerf360/bonsai --max-num-iterations 7000 --viewer.quit-on-train-completion True --vis tensorboard colmap --images-path images --colmap-path sparse/0 --downscale-factor 4 --downscale-rounding-mode round 2>&1 | tee /workspace/nerfstudio-rocm/tests/rocm/logs/splatfacto.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocm-smoke-logs
          path: tests/rocm/logs/
